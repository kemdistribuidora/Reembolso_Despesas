<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Despesas — Distribuidora KEM</title>
  <link rel="icon" type="image/png" href="imagens/icone.png" />
  <style>
    :root {
      /* Paleta da marca KEM */
      --brand-orange: #F7941E;
      --brand-red: #E63329;
      --brand-navy: #1B2A4A;
      --brand-blue: #2E5AA8;
      --gradient: linear-gradient(135deg, #F9A81D 0%, #F7941E 40%, #E63329 100%);

      --bg: #eef1f6;
      --card: #ffffff;
      --border: #d7dce5;
      --text: #1B2A4A;
      --muted: #6b7280;
      --ok: #16a34a;
      --err: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(27, 42, 74, .12);
    }
    /* Barra superior com o gradiente da marca */
    .card::before {
      content: "";
      display: block;
      height: 6px;
      background: var(--gradient);
    }
    .header {
      text-align: center;
      padding: 26px 28px 6px;
    }
    .header img {
      height: 56px;
      width: auto;
      margin-bottom: 14px;
    }
    .body { padding: 6px 28px 30px; }
    h1 {
      margin: 0 0 4px;
      font-size: 1.3rem;
      color: var(--brand-navy);
    }
    .sub {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: .9rem;
    }
    label {
      display: block;
      font-size: .78rem;
      font-weight: 600;
      color: var(--brand-navy);
      margin: 14px 0 6px;
      letter-spacing: .03em;
    }
    input, textarea {
      width: 100%;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 11px 12px;
      font-size: .95rem;
      font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--brand-blue);
      box-shadow: 0 0 0 3px rgba(46, 90, 168, .15);
    }
    textarea { resize: vertical; min-height: 68px; }
    input[type="file"] { padding: 9px 12px; }
    input[type="file"]::file-selector-button {
      background: var(--brand-navy);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      margin-right: 10px;
      cursor: pointer;
      font-family: inherit;
    }
    button {
      width: 100%;
      margin-top: 24px;
      background: var(--gradient);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .02em;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(230, 51, 41, .28);
      transition: filter .15s, transform .05s;
    }
    button:hover { filter: brightness(1.05); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .6; cursor: not-allowed; filter: none; }
    .msg {
      margin-top: 16px;
      font-size: .9rem;
      text-align: center;
      min-height: 20px;
      font-weight: 500;
    }
    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--err); }
    .foot {
      text-align: center;
      margin-top: 18px;
      font-size: .72rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <img src="imagens/Distribuidora_KEM.png" alt="Distribuidora KEM" />
      <h1>Cadastro de Despesas</h1>
      <p class="sub">Preencha os dados abaixo para registrar uma despesa.</p>
    </div>
    <div class="body">

    <form id="form">
      <label for="data">DATA</label>
      <input type="date" id="data" name="data" required />

      <label for="nome">NOME</label>
      <input type="text" id="nome" name="nome" placeholder="Nome de quem gastou" required />

      <label for="descricao">DESCRIÇÃO</label>
      <textarea id="descricao" name="descricao" placeholder="Descrição da despesa" required></textarea>

      <label for="valor">VALOR (R$)</label>
      <input type="number" id="valor" name="valor" step="0.01" min="0" placeholder="0,00" required />

      <label for="autorizado">AUTORIZADO POR?</label>
      <input type="text" id="autorizado" name="autorizado" placeholder="Quem autorizou" required />

      <label for="anexo">ANEXO (comprovante)</label>
      <input type="file" id="anexo" name="anexo" accept="image/*,.pdf" />

      <button type="submit" id="btn">Salvar despesa</button>
      <div class="msg" id="msg"></div>
    </form>
      <p class="foot">Distribuidora KEM · Controle de Despesas</p>
    </div>
  </div>

  <script>
    // ===== CONFIGURAÇÃO =====
    // Cole aqui a URL do seu Web App do Google Apps Script (ver README.md)
    const WEB_APP_URL = "https://script.google.com/machttps://script.google.com/macros/s/AKfycbzuHmk6-NWaA-E6ydFEne2mEBt62Pew1J7eXdbn8X4Qk1MKOskfiMmQihC6u0ZVI7iQ/execros/s/AKfycbzAphUqhsqDcO_080YXKnSPrYXoaixhgs4fVtPIpquqtEQCdRUUjPwNqxLuoHObACU/exec";
    // ========================

    const form = document.getElementById("form");
    const btn = document.getElementById("btn");
    const msg = document.getElementById("msg");

    // Preenche a data de hoje por padrão
    document.getElementById("data").valueAsDate = new Date();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (WEB_APP_URL.startsWith("COLE_AQUI")) {
        show("Configure a URL do Apps Script em index.html (WEB_APP_URL).", "err");
        return;
      }

      const dados = {
        data: form.data.value,
        nome: form.nome.value.trim(),
        descricao: form.descricao.value.trim(),
        valor: form.valor.value,
        autorizado: form.autorizado.value.trim(),
      };

      btn.disabled = true;
      show("Salvando...", "");

      // Se houver anexo, lê o arquivo e converte para base64
      const arquivo = form.anexo.files[0];
      if (arquivo) {
        if (arquivo.size > 25 * 1024 * 1024) {
          show("Anexo muito grande (máx. 25 MB).", "err");
          btn.disabled = false;
          return;
        }
        try {
          const base64 = await lerArquivoBase64(arquivo);
          dados.anexoNome = arquivo.name;
          dados.anexoTipo = arquivo.type || "application/octet-stream";
          dados.anexoBase64 = base64;
        } catch (err) {
          show("Falha ao ler o anexo: " + err.message, "err");
          btn.disabled = false;
          return;
        }
      }

      try {
        const resp = await fetch(WEB_APP_URL, {
          method: "POST",
          // text/plain evita o preflight de CORS com o Apps Script
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(dados),
        });
        const result = await resp.json();

        if (result.ok) {
          show("Despesa salva com sucesso!", "ok");
          form.reset();
          document.getElementById("data").valueAsDate = new Date();
        } else {
          show("Erro ao salvar: " + (result.error || "desconhecido"), "err");
        }
      } catch (err) {
        show("Falha na conexão: " + err.message, "err");
      } finally {
        btn.disabled = false;
      }
    });

    function show(text, type) {
      msg.textContent = text;
      msg.className = "msg " + (type || "");
    }

    // Lê um arquivo e retorna só o conteúdo em base64 (sem o prefixo data:)
    function lerArquivoBase64(arquivo) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = () => reject(new Error("erro de leitura"));
        reader.readAsDataURL(arquivo);
      });
    }
  </script>
</body>
</html>
